[project]
name = "pyrig-runtime"
version = "3.26.3"
description = "Plugin system and CLI engine for projects built with pyrig."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
keywords = [
  "automatic-plugin-discovery",
  "class-based-plugins",
  "cli",
  "cli-framework",
  "command-line-interface",
  "cross-package-plugins",
  "dependency-graph",
  "plugin",
  "plugin-architecture",
  "plugin-discovery",
  "plugin-framework",
  "plugin-system",
  "pyrig-runtime",
  "python-cli",
  "subclass-discovery",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.27.3",
]

[project.urls]
Changelog = "https://github.com/Winipedia/pyrig-runtime/releases"
Documentation = "https://Winipedia.github.io/pyrig-runtime"
Homepage = "https://github.com/Winipedia/pyrig-runtime"
Issues = "https://github.com/Winipedia/pyrig-runtime/issues"
Source = "https://github.com/Winipedia/pyrig-runtime"

[project.scripts]
pyrig-runtime = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "mkdocstrings[python]>=1.0.7",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.5",
  "pyflakes>=4.0.3",
  "pyrig-fixtures>=2.26.1",
  "pyrig-opensource>=1.2.7",
  "pyrig-pypi>=3.21.14",
  "pyrig-runtime-overrides>=2.15.36",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.0",
  "rumdl>=0.2.79",
  "ryl>=0.24.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.8.4",
  "ty>=0.0.86",
  "typos>=1.51.1",
  "vulture>=2.16",
  "zensical>=0.0.70",
  "zizmor>=1.30.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "typer",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=100",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=pyrig_runtime",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.rules]
ALL = "enable"
key-ordering = "disable"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
